header{display:flex;align-items:center;gap:8px;margin-bottom:10px}

select,textarea{width:100%;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card2)}
textarea{min-height:64px;resize:vertical}
label.l{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.chip.on{background:var(--pu);border-color:var(--pu);color:#fff}
.cta{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;color:#fff;background:linear-gradient(90deg,#4b2bb0,#8d3fd6 60%,#0fa3a3);margin:4px 0 10px}
.res{border-radius:16px;padding:12px;margin-bottom:10px}

.b.G{background:var(--gb);color:var(--g)}.b.Y{background:var(--yb);color:var(--y)}.b.R{background:var(--rb);color:var(--r)}

.disc{font-size:11px;color:var(--mu);text-align:center;margin:10px 0 24px}
.ok{background:var(--card);border:1px solid var(--te);border-radius:12px;padding:10px;margin-top:8px}
.hid{display:none}
